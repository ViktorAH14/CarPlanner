name: Backend CI

on:
  push:
    branches: [main, ci-cd/separate-workflows]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carplanner_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint

      - name: Create test database
        working-directory: ./backend
        run: |
          if ! psql -h localhost -U postgres -d carplaner_db -tAc "SELECT 1 FROM pg_database WHERE datname='carplanner_test_db'" | grep -q 1; then
            psql -h localhost -U postgres -d carplaner_db -c "CREATE DATABASE carplanner_test_db;"
          fi
        env:
          PGPASSWORD: postgres

      - name: Test
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carplanner_db
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carplanner_test_db
          NODE_ENV: test
          JWT_SECRET: dummy_secret
        run: npm test
