name: Backend CI

on:
  push:
    branches: [main, ci-cd/separate-workflows]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carplanner_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check format with Prettier
        working-directory: ./backend
        run: npm run check-format

      - name: Lint
        working-directory: ./backend
        run: npm run lint

      - name: Create test database
        working-directory: ./backend
        run: |
          psql -h localhost -U postgres -d carplanner_db -c "CREATE DATABASE carplanner_test_db;" || true
        env:
          PGPASSWORD: postgres

      - name: Test with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carplanner_db
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carplanner_test_db
          NODE_ENV: test
          JWT_SECRET: dummy_secret
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage
          retention-days: 7

      - name: Generate JSDoc HTML documentation
        working-directory: ./backend
        run: npm run generate:docs

      - name: Validate JSDoc output
        working-directory: ./backend
        run: |
          if [ ! -f "docs/jsdoc/index.html" ]; then
            echo "❌ Error: index.html not found in docs/jsdoc. Documentation generation failed."
            exit 1
          fi
          echo "✅ docs/jsdoc/index.html exists."

      - name: Upload JSDoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsdoc-docs
          path: backend/docs/jsdoc
          retention-days: 7
